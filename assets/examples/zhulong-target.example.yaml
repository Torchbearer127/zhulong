schema_version: 1

target:
  name: "example-service"
  repo_root: "."
  tested_ref: "git-commit-sha-or-local-state"
  language_hint:
    - "python"
    - "node"

runtime:
  type: "docker-compose"
  compose_file: "docker-compose.zhulong.yml"
  service: "app"
  healthcheck:
    command: "curl -fsS http://127.0.0.1:8080/health"
    timeout_seconds: 30

build:
  command: "docker compose -f docker-compose.zhulong.yml build"
  network_required: true

start:
  command: "docker compose -f docker-compose.zhulong.yml up -d"
  readiness:
    command: "curl -fsS http://127.0.0.1:8080/health"
    timeout_seconds: 60

verify:
  mode: "fresh-container"
  allowed_network: "local-only"
  success_oracles:
    - type: "http_response"
    - type: "log_pattern"
  cleanup:
    command: "docker compose -f docker-compose.zhulong.yml down -v"

scope:
  entrypoints:
    - id: "import-url"
      kind: "http"
      route: "POST /api/import"
      auth: "low-privileged-user"
      attacker_control:
        - "url"
        - "filename"
  trust_boundaries:
    - "external HTTP request -> backend import worker"
  in_scope_bug_classes:
    - "SSRF"
    - "path traversal"
    - "command injection"
  out_of_scope:
    - "admin-only trusted configuration"
    - "requires shell on host"
